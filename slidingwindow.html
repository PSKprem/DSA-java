ft) - t.charAt(left));\n                left++;\n            }\n\n            maxLen = Math.max(maxLen, right - left + 1);\n        }\n\n        return maxLen;\n    }\n}", "python": "class Solution:\n    def equalSubstring(self, s: str, t: str, maxCost: int) -> int:\n        left = 0\n        curr_cost = 0\n        max_len = 0\n\n        for right in range(len(s)):\n            curr_cost += abs(ord(s[right]) - ord(t[right]))\n\n            # Budget exceed hote hi left shrink karo\n            while curr_cost > maxCost:\n                curr_cost -= abs(ord(s[left]) - ord(t[left]))\n                left += 1\n\n            max_len = max(max_len, right - left + 1)\n\n        return max_len"}, {"id": 15, "lc": 1456, "premium": false, "title": "Maximum Number of Vowels in a Substring of Given Length", "difficulty": "Medium", "pattern": "Fixed-Size Window (Vowel Counter)", "time": "O(N)", "space": "O(1)", "statement": "Given a string <code>s</code> and an integer <code>k</code>, return the maximum number of vowel letters in any substring of <code>s</code> with length <code>k</code>.<br>Vowel letters in English are <code>'a', 'e', 'i', 'o', 'u'</code>.", "examples": [{"input": "s = \"abciiidef\", k = 3", "output": "3", "explain": "The substring \"iii\" contains 3 vowel letters."}, {"input": "s = \"aeiou\", k = 2", "output": "2", "explain": "Any substring of length 2 contains 2 vowels."}, {"input": "s = \"leetcode\", k = 3", "output": "2", "explain": "\"lee\", \"eet\" and \"ode\" contain 2 vowels."}], "constraints": ["1 <= s.length <= 10^5", "s consists of lowercase English letters.", "1 <= k <= s.length"], "statementHi": "String <code>s</code> me se exactly <code>k</code> length ka aisa tukda nikalo jisme vowels (a, e, i, o, u) ki ginti sabse zyada ho.", "memoryFlow": "s = \"a  b  c  i  i  i  d  e  f\", k = 3\n[a, b, c] -> vowels = 1 ('a')\n   [b, c, i] -> vowels = 1 ('i')\n      [c, i, i] -> vowels = 2 ('i', 'i')\n         [i, i, i] -> vowels = 3 (MAX possible for k=3!) -> Early Exit!", "memoryTip": "Agar kisi window me vowel count == k ban jaye, toh usse bada answer physically possible nahi hai — seedhe return k kar do (Early Exit Optimization)!", "intuition": "<b>Classic Fixed-Size Window:</b>\n1. Helper function `isVowel(char c)` banao.\n2. Pehle $k$ characters me vowels count karo `vowels`.\n3. `maxVowels = vowels`. Agar `maxVowels == k` toh direct return `k`.\n4. Index $k$ se aage slide karo:\n   - Agar aane wala character vowel hai: `vowels++`\n   - Agar bahar nikalne wala character vowel tha: `vowels--`\n   - `maxVowels = max(maxVowels, vowels)`\n   - Early exit if `maxVowels == k`.\n5. Return `maxVowels`.", "pitfalls": ["Vowels set me lookup karne ke bajaye `c == 'a' || c == 'e' || ...` switch/if likhne se run-time speed 3x fast ho jati hai."], "java": "class Solution {\n    public int maxVowels(String s, int k) {\n        int vowels = 0;\n\n        // Pehli window\n        for (int i = 0; i < k; i++) {\n            if (isVowel(s.charAt(i))) vowels++;\n        }\n\n        int maxVowels = vowels;\n        if (maxVowels == k) return k; // Early exit\n\n        // Slide window\n        for (int i = k; i < s.length(); i++) {\n            if (isVowel(s.charAt(i))) vowels++;       // right add\n            if (isVowel(s.charAt(i - k))) vowels--;   // left remove\n\n            maxVowels = Math.max(maxVowels, vowels);\n            if (maxVowels == k) return k; // Max possible reached\n        }\n\n        return maxVowels;\n    }\n\n    private boolean isVowel(char c) {\n        return c == 'a' || c == 'e' || c == 'i' || c == 'o' || c == 'u';\n    }\n}", "python": "class Solution:\n    def maxVowels(self, s: str, k: int) -> int:\n        vowels_set = {'a', 'e', 'i', 'o', 'u'}\n        curr_vowels = sum(1 for ch in s[:k] if ch in vowels_set)\n        max_vowels = curr_vowels\n\n        if max_vowels == k:\n            return k\n\n        for i in range(k, len(s)):\n            if s[i] in vowels_set:\n                curr_vowels += 1\n            if s[i - k] in vowels_set:\n                curr_vowels -= 1\n\n            if curr_vowels > max_vowels:\n                max_vowels = curr_vowels\n                if max_vowels == k:\n                    return k\n\n        return max_vowels"}, {"id": 16, "lc": 713, "premium": false, "title": "Subarray Product Less Than K", "difficulty": "Medium", "pattern": "Variable-Size Window (Subarray Count Formula)", "time": "O(N)", "space": "O(1)", "statement": "Given an array of integers <code>nums</code> and an integer <code>k</code>, return the number of contiguous subarrays where the product of all the elements in the subarray is strictly less than <code>k</code>.", "examples": [{"input": "nums = [10,5,2,6], k = 100", "output": "8", "explain": "The 8 subarrays that have product less than 100 are: [10], [5], [2], [6], [10, 5], [5, 2], [2, 6], [5, 2, 6]. Note that [10, 5, 2] is not included since the product of 100 is not strictly less than k."}, {"input": "nums = [1,2,3], k = 0", "output": "0", "explain": "Product of positive integers cannot be less than 0."}], "constraints": ["1 <= nums.length <= 3 * 10^4", "1 <= nums[i] <= 1000", "0 <= k <= 10^6"], "statementHi": "Array me aise kitne continuous subarrays hain jinke saare numbers ka guna (product) strictly <code>k</code> se chhota ho?", "memoryFlow": "nums = [ 10, 5, 2, 6 ], k = 100\nR=0 (10): prod=10 < 100 -> valid window [10]. New subarrays ending at R=0: [10] -> count += (0-0+1) = 1\nR=1 (5):  prod=50 < 100 -> valid window [10, 5]. New ending at R=1: [5], [10, 5] -> count += (1-0+1) = 2\nR=2 (2):  prod=100 >= 100! (INVALID). Shrink L: remove 10 -> prod = 10 < 100.\n          Valid window [5, 2]. New ending at R=2: [2], [5, 2] -> count += (2-1+1) = 2\nR=3 (6):  prod=60 < 100 -> valid window [5, 2, 6]. New ending at R=3: [6], [2,6], [5,2,6] -> count += (3-1+1) = 3\n\nTotal Count = 1 + 2 + 2 + 3 = 8!", "memoryTip": "Formula: Har valid window [L..R] me right par end hone wale EXACT (right - left + 1) subarrays hote hain!", "intuition": "<b>Counting Subarrays Magic Formula:</b>\nJab window <code>[left .. right]</code> ka product strictly $< k$ ho jata hai, toh index `right` par END hone wale naye subarrays kitne bante hain?\n- `[nums[right]]`\n- `[nums[right-1], nums[right]]`\n- `...`\n- `[nums[left], ..., nums[right]]`\nInki kul sankhya exactly <b>(right - left + 1)</b> hoti hai!\nHar `right` ke sath hum `count += (right - left + 1)` jodte chalte hain.", "pitfalls": ["Agar `k <= 1`, toh product positive numbers ka kabhi bhi < 1 nahi ho sakta, seedhe `return 0` karna zaroori hai (warna infinite loop lag sakta hai)!", "Divide karte waqt `prod /= nums[left]` use karein."], "java": "class Solution {\n    public int numSubarrayProductLessThanK(int[] nums, int k) {\n        // Crucial edge case: numbers positive hain (>= 1), isliye product >= 1 rahega\n        if (k <= 1) return 0;\n\n        int left = 0;\n        int prod = 1;\n        int count = 0;\n\n        for (int right = 0; right < nums.length; right++) {\n            prod *= nums[right];\n\n            // Product >= k ho toh left ko aage badha kar shrink karo\n            while (prod >= k && left <= right) {\n                prod /= nums[left];\n                left++;\n            }\n\n            // Key formula: right par end hone wale valid subarrays\n            count += (right - left + 1);\n        }\n\n        return count;\n    }\n}", "python": "class Solution:\n    def numSubarrayProductLessThanK(self, nums: list[int], k: int) -> int:\n        if k <= 1:\n            return 0\n\n        left = 0\n        prod = 1\n        count = 0\n\n        for right in range(len(nums)):\n            prod *= nums[right]\n\n            while prod >= k and left <= right:\n                prod //= nums[left]\n                left += 1\n\n            count += (right - left + 1)\n\n        return count"}, {"id": 17, "lc": 340, "premium": true, "title": "Longest Substring with At Most K Distinct Characters", "difficulty": "Medium", "pattern": "Variable-Size Window (Hash Map Size <= K)", "time": "O(N)", "space": "O(K)", "statement": "Given a string <code>s</code> and an integer <code>k</code>, return the length of the <b>longest substring</b> of <code>s</code> that contains at most <code>k</code> <b>distinct characters</b>.", "examples": [{"input": "s = \"eceba\", k = 2", "output": "3", "explain": "The substring is \"ece\" with length 3."}, {"input": "s = \"aa\", k = 1", "output": "2", "explain": "The substring is \"aa\" with length 2."}], "constraints": ["1 <= s.length <= 5 * 10^4", "0 <= k <= 50"], "statementHi": "String <code>s</code> me se aisa sabse lamba tukda (substring) dhoondo jisme zyada se zyada <code>k</code> alag-alag (distinct) characters hon.", "memoryFlow": "s = \"e  c  e  b  a\", k = 2\nR=0 'e': map={'e':1} (distinct=1 <= 2)\nR=1 'c': map={'e':1, 'c':1} (distinct=2 <= 2)\nR=2 'e': map={'e':2, 'c':1} (distinct=2 <= 2) -> len = 3 (\"ece\")\nR=3 'b': map={'e':2, 'c':1, 'b':1} (distinct=3 > 2! INVALID)\nShrink L: remove until map.size() <= 2.\nL moves past 'e', then past 'c' (c removed!) -> map={'e':1, 'b':1}\nMax Len = 3", "memoryTip": "Map ka size hi distinct characters ki sankhya batata hai. Jaise hi map.size() > k ho, left ko tab tak aage badhao jab tak koi character count 0 hokar map se remove na ho jaye.", "intuition": "<b>Pattern: Variable Window with Unique Element Bound:</b>\n1. HashMap `freq` maintain karo: `Character -> count`.\n2. `right` pointer badhao aur `freq.put(c, freq.getOrDefault(c, 0) + 1)`.\n3. Jab `freq.size() > k` ho jaye:\n   - `char leftChar = s.charAt(left)`\n   - `freq.put(leftChar, freq.get(leftChar) - 1)`\n   - Agar frequency 0 ho jaye, toh <b>`freq.remove(leftChar)`</b> karna mat bhoolo!\n   - `left++`\n4. `maxLen = max(maxLen, right - left + 1)`.\n\nTotal time $O(N)$ kyunki har character at most twice process hota hai.", "pitfalls": ["k = 0 hone par answer hamesha 0 hota hai.", "Map me frequency 0 hone par remove karna mandatory hai, warna `map.size()` shrink nahi hogi!"], "java": "import java.util.*;\n\nclass Solution {\n    public int lengthOfLongestSubstringKDistinct(String s, int k) {\n        if (s == null || s.length() == 0 || k <= 0) return 0;\n\n        Map<Character, Integer> freq = new HashMap<>();\n        int left = 0;\n        int maxLen = 0;\n\n        for (int right = 0; right < s.length(); right++) {\n            char c = s.charAt(right);\n            freq.put(c, freq.getOrDefault(c, 0) + 1);\n\n            // Jab distinct characters k se zyada ho jayein\n            while (freq.size() > k) {\n                char leftChar = s.charAt(left);\n                freq.put(leftChar, freq.get(leftChar) - 1);\n                if (freq.get(leftChar) == 0) {\n                    freq.remove(leftChar); // Size reduce karne ke liye zaroori hai\n                }\n                left++;\n            }\n\n            maxLen = Math.max(maxLen, right - left + 1);\n        }\n\n        return maxLen;\n    }\n}", "python": "class Solution:\n    def lengthOfLongestSubstringKDistinct(self, s: str, k: int) -> int:\n        if not s or k <= 0:\n            return 0\n\n        freq = {}\n        left = 0\n        max_len = 0\n\n        for right, ch in enumerate(s):\n            freq[ch] = freq.get(ch, 0) + 1\n\n            while len(freq) > k:\n                left_ch = s[left]\n                freq[left_ch] -= 1\n                if freq[left_ch] == 0:\n                    del freq[left_ch]\n                left += 1\n\n            max_len = max(max_len, right - left + 1)\n\n        return max_len"}, {"id": 18, "lc": 159, "premium": true, "title": "Longest Substring with At Most Two Distinct Characters", "difficulty": "Medium", "pattern": "Variable-Size Window (K = 2 Distinct Bound)", "time": "O(N)", "space": "O(1)", "statement": "Given a string <code>s</code>, return the length of the <b>longest substring</b> that contains at most <b>two distinct characters</b>.", "examples": [{"input": "s = \"eceba\"", "output": "3", "explain": "The substring is \"ece\" which its length is 3."}, {"input": "s = \"ccaabbb\"", "output": "5", "explain": "The substring is \"aabbb\" which its length is 5."}], "constraints": ["1 <= s.length <= 10^5", "s consists of English letters."], "statementHi": "String <code>s</code> me sabse lamba continuous tukda (substring) dhoondo jisme jyada se jyada 2 alag-alag characters aa sakte hon.", "memoryFlow": "s = \"c  c  a  a  b  b  b\"\n[c, c] -> 1 distinct <= 2 (len = 2)\n[c, c, a, a] -> 2 distinct ('c', 'a') (len = 4)\nNext comes 'b': [c, c, a, a, b] -> 3 distinct ('c', 'a', 'b') > 2!\nShrink L past all 'c's:\nWindow becomes [a, a, b, b, b] -> 2 distinct ('a', 'b') (len = 5! MAX)", "memoryTip": "Ye LC 340 (At Most K Distinct) ka exact case hai jahan K = 2 hai. LC 904 (Fruit into Baskets) bhi exactly yahi problem hai!", "intuition": "<b>Direct Application of At Most 2 Window:</b>\nYe problem LeetCode 904 (Fruit into Baskets) aur LeetCode 340 (At Most K Distinct with K=2) ki exact duplicate hai.\nMap me character frequencies store karo.\nJaise hi `map.size() > 2` ho, `left` pointer se characters remove karte jao jab tak koi ek character poori tarah map se delete na ho jaye.", "pitfalls": ["Agar string length $\\le 2$ ho, toh answer seedhe `s.length()` hota hai."], "java": "import java.util.*;\n\nclass Solution {\n    public int lengthOfLongestSubstringTwoDistinct(String s) {\n        if (s == null || s.length() == 0) return 0;\n        if (s.length() <= 2) return s.length();\n\n        Map<Character, Integer> map = new HashMap<>();\n        int left = 0;\n        int maxLen = 0;\n\n        for (int right = 0; right < s.length(); right++) {\n            char c = s.charAt(right);\n            map.put(c, map.getOrDefault(c, 0) + 1);\n\n            while (map.size() > 2) {\n                char leftChar = s.charAt(left);\n                map.put(leftChar, map.get(leftChar) - 1);\n                if (map.get(leftChar) == 0) {\n                    map.remove(leftChar);\n                }\n                left++;\n            }\n\n            maxLen = Math.max(maxLen, right - left + 1);\n        }\n\n        return maxLen;\n    }\n}", "python": "class Solution:\n    def lengthOfLongestSubstringTwoDistinct(self, s: str) -> int:\n        if len(s) <= 2:\n            return len(s)\n\n        freq = {}\n        left = 0\n        max_len = 0\n\n        for right, ch in enumerate(s):\n            freq[ch] = freq.get(ch, 0) + 1\n\n            while len(freq) > 2:\n                left_ch = s[left]\n                freq[left_ch] -= 1\n                if freq[left_ch] == 0:\n                    del freq[left_ch]\n                left += 1\n\n            max_len = max(max_len, right - left + 1)\n\n        return max_len"}, {"id": 19, "lc": 76, "premium": false, "title": "Minimum Window Substring", "difficulty": "Hard", "pattern": "Variable-Size Window (Shrink While Valid / Have == Need)", "time": "O(M + N)", "space": "O(1)", "statement": "Given two strings <code>s</code> and <code>t</code> of lengths <code>m</code> and <code>n</code> respectively, return the <b>minimum window substring</b> of <code>s</code> such that every character in <code>t</code> (<b>including duplicates</b>) is included in the window. If there is no such substring, return the empty string <code>\"\"</code>.<br>The testcases will be generated such that the answer is <b>unique</b>.", "examples": [{"input": "s = \"ADOBECODEBANC\", t = \"ABC\"", "output": "\"BANC\"", "explain": "The minimum window substring \"BANC\" includes 'A', 'B', and 'C' from string t."}, {"input": "s = \"a\", t = \"a\"", "output": "\"a\"", "explain": "The entire string s is the minimum window."}, {"input": "s = \"a\", t = \"aa\"", "output": "\"\"", "explain": "Both 'a's from t must be included in the window. Since the largest window of s only has one 'a', return empty string."}], "constraints": ["m == s.length", "n == t.length", "1 <= m, n <= 10^5", "s and t consist of uppercase and lowercase English letters."], "statementHi": "String <code>s</code> me se sabse CHHOTA aisa substring dhoondo jisme string <code>t</code> ke saare characters (unke duplicate counts sahit) cover ho rahe hon. Agar koi aisa window na mile toh empty string <code>\"\"</code> return karo.", "memoryFlow": "s = \"A D O B E C O D E B A N C\", t = \"ABC\"\nRequired: {A:1, B:1, C:1} -> need = 3 distinct chars satisfied\n\nExpand R until all satisfied (have == need):\nWindow: [A D O B E C] -> contains A, B, C! (len = 6)\nNow shrink L from left:\nRemove A -> have becomes 2 < 3 (INVALID, stop shrinking)\n\nKeep expanding R, next time valid window: [B A N C] (len = 4! MINIMUM)\nResult = \"BANC\" ", "memoryTip": "NeetCode Core: Do variables rakho: 'need' (t ke distinct required characters) aur 'have' (window me kitne satisfy ho gaye). Jab have == need, tab answer minimize karo!", "intuition": "<b>NeetCode Classic 'have == need' Technique:</b>\n1. Map `targetFreq` me string `t` ke har character ki required count store karo.\n2. `need = targetFreq.size()` (kitne unique characters ki requirements poori karni hain).\n3. `have = 0` (window me abhi tak kitne unique characters required count tak pahunch chuke hain).\n4. `right` pointer ko aage badhao:\n   - Agar `s[right]` target me hai, toh window frequency increment karo.\n   - Agar `windowFreq[s[right]] == targetFreq[s[right]]`, toh `have++`!\n5. Jab tak <b>`have == need`</b> (window fully valid hai):\n   - Min length aur start index update karo!\n   - Window ko chhota banane ke liye `left` character ko bahar nikalo.\n   - Agar bahar nikalne wala character target ka hissa tha aur uski frequency target se kam ho gayi, toh `have--`!\n   - `left++`.", "pitfalls": ["Java me `Integer` objects compare karte waqt `==` mat lagayein kyunki `> 127` par reference comparison fail hota hai! Use `.equals()` or primitive int.", "Case sensitivity: letters uppercase and lowercase dono hain, so map size 128 use karein."], "java": "import java.util.*;\n\nclass Solution {\n    public String minWindow(String s, String t) {\n        if (s == null || t == null || s.length() < t.length()) return \"\";\n\n        int[] target = new int[128];\n        for (char c : t.toCharArray()) target[c]++;\n\n        int need = 0; // Kitne distinct characters chahiye\n        for (int count : target) {\n            if (count > 0) need++;\n        }\n\n        int[] window = new int[128];\n        int have = 0;\n\n        int minLen = Integer.MAX_VALUE;\n        int startIdx = 0;\n        int left = 0;\n\n        for (int right = 0; right < s.length(); right++) {\n            char rChar = s.charAt(right);\n            window[rChar]++;\n\n            // Agar is character ki requirement exact match ho gayi\n            if (target[rChar] > 0 && window[rChar] == target[rChar]) {\n                have++;\n            }\n\n            // Jab tak window me saare required characters maujood hain\n            while (have == need) {\n                // Minimum window update karo\n                if (right - left + 1 < minLen) {\n                    minLen = right - left + 1;\n                    startIdx = left;\n                }\n\n                // Left pointer shrink karke window chhota karo\n                char lChar = s.charAt(left);\n                window[lChar]--;\n                if (target[lChar] > 0 && window[lChar] < target[lChar]) {\n                    have--; // Requirement toot gayi\n                }\n                left++;\n            }\n        }\n\n        return minLen == Integer.MAX_VALUE ? \"\" : s.substring(startIdx, startIdx + minLen);\n    }\n}", "python": "class Solution:\n    def minWindow(self, s: str, t: str) -> str:\n        if not s or not t or len(s) < len(t):\n            return \"\"\n\n        from collections import Counter\n        target = Counter(t)\n        window = {}\n\n        have, need = 0, len(target)\n        min_len = float('inf')\n        res_idx = (0, 0)\n        left = 0\n\n        for right, ch i xity O(N) honi chahiye.", "memoryFlow": "nums = [ 1, 3, -1, -3, 5, 3, 6, 7 ], k = 3\nDeque stores indices. Values are strictly decreasing:\ni=0 (1): Deque = [0] (val: 1)\ni=1 (3): 3 > 1 -> pop 0! Deque = [1] (val: 3)\ni=2 (-1): -1 < 3 -> push 2. Deque = [1, 2] (vals: 3, -1)\n          Window 1 max = nums[dq.peekFirst()] = 3\ni=3 (-3): -3 < -1 -> push 3. Deque = [1, 2, 3] (vals: 3, -1, -3)\n          Window 2 max = 3\ni=4 (5): 5 > -3, -1, 3 -> pop all! Deque = [4] (val: 5)\n          Window 3 max = 5\n...\nHar step O(1) amortized!", "memoryTip": "Monotonic Deque Rule: Naya element nums[i] aane par peeche se saare chhote elements ko pop kar do (kyunki wo kabhi maximum nahi ban sakte!).", "intuition": "<b>Why Heap is O(N log K) and Deque is O(N)?</b>\nMax-Heap se solve karne par remove operation $O(k)$ ya $O(\\log k)$ leta hai, total $O(N \\log K)$.\n<b>Monotonic Deque O(N) Intuition:</b>\n- Deque me hum elements ke <b>indices</b> store karte hain.\n- Deque ke andar values hamesha <b>strictly decreasing</b> order me rehti hain.\n- Isliye Deque ka **front element (`peekFirst`) hamesha current window ka MAX** hota hai!\n1. Window se out-of-bounds hua index (`dq.peekFirst() <= i - k`) front se hata do.\n2. Back se saare indices hatao jinki value $\\le nums[i]$ ho (`nums[dq.peekLast()] <= nums[i]`).\n3. Index `i` ko Deque me add karo.\n4. Jab `i >= k - 1` ho, tab `result[ri++] = nums[dq.peekFirst()]`.", "pitfalls": ["Deque me values store karne ke bajaye **indices** store karein taaki out-of-window check `dq.peekFirst() <= i - k` easily ho sake.", "ArrayDeque Java me `LinkedList` se 2-3x fast hota hai."], "java": "import java.util.*;\n\nclass Solution {\n    public int[] maxSlidingWindow(int[] nums, int k) {\n        int n = nums.length;\n        if (n == 0 || k == 0) return new int[0];\n\n        int[] result = new int[n - k + 1];\n        int ri = 0;\n\n        // Monotonic Deque: indices store karta hai, decreasing order me\n        Deque<Integer> dq = new ArrayDeque<>(     function escapeHtml(str) {
      if (typeof str !== 'string') return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // ==========================================================
    // SYNTAX HIGHLIGHTER (single-pass tokenizer)
    // ==========================================================
    const JAVA_KEYWORDS = new Set([
      'class','public','private','protected','static','final','void','int','long','double','boolean','char',
      'new','return','if','else','while','for','null','true','false','this','break','continue','import','package','extends','implements'
    ]);
    const PY_KEYWORDS = new Set([
      'class','def','return','if','else','elif','while','for','in','not','and','or','is','None','True','False',
      'nonlocal','global','import','from','as','self','pass','break','continue','lambda'
    ]);
    const PY_TYPES = new Set(['int','bool','float','str','list','dict','set','tuple']);

    const JAVA_TOKEN_RE = /(\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*")|('(?:[^'\\\n]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/g;
    const PY_TOKEN_RE   = /(#[^\n]*)|("(?:[^"\\\n]|\\.)*")|('(?:[^'\\\n]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/g;

    function highlightCode(code, lang) {
      const isJava = lang === 'java';
      const re = new RegExp((isJava ? JAVA_TOKEN_RE : PY_TOKEN_RE).source, 'g');
      const keywords = isJava ? JAVA_KEYWORDS : PY_KEYWORDS;
      const span = (cls, text) => `<span class="token ${cls}">${escapeHtml(text)}</span>`;

      let out = '';
      let last = 0;
      let m;
      while ((m = re.exec(code)) !== null) {
        out += escapeHtml(code.slice(last, m.index));
        const text = m[0];
        if (m[1]) out += span('comment', text);
        else if (m[2] || m[3]) out += span('string', text);
        else if (m[4]) out += span('number', text);
        else {
          const nextChar = code[re.lastIndex];
          if (keywords.has(text)) out += span('keyword', text);
          else if (!isJava && PY_TYPES.has(text)) out += span('class-name', text);
          else if (/^[A-Z]\w*[a-z]\w*$/.test(text)) out += span('class-name', text);
          else if (nextChar === '(') out += span('function', text);
          else out += escapeHtml(text);
        }
        last = re.lastIndex;
      }
      out += escapeHtml(code.slice(last));
      return out;
    }

        <div class="q-grid">${cardsHtml}</div>
      `;
      if (!keepScroll) window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ==========================================================
    // SINGLE QUESTION PAGE
    // ==========================================================
    function renderExamples(q) {
      return q.examples.map((ex, i) => `
        <div class="example-box"><span class="lbl">Example ${i + 1}:</span>
<span class="lbl">Input:</span>  ${escapeHtml(ex.input)}
<span class="lbl">Output:</span> ${escapeHtml(ex.output)}${ex.explain ? `
<span class="lbl">Explanation:</span> <span class="explain">${escapeHtml(ex.explain)}</span>` : ''}</div>
      `).join('');
    }

    function showQuestion(id, keepScroll = false) {
      currentView = id;
      updateNavButtons();
      const q = questions.find(item => item.id === id);
      document.getElementById('breadcrumb').innerText = `Questions / #${q.id} ${q.title}`;

      const rawCode = currentLang === 'java' ? q.java : q.python;
      const coloredCode = highlightCode(rawCode, currentLang);

      document.getElementById('viewContainer').innerHTML = `
        <div class="problem-header">
          <button class="btn-secondary" style="margin-bottom: 16px; padding: 6px 12px; font-size: 0.85rem;" onclick="showAllQuestions()">
            ← Back to All Questions
          </button>
          <div class="problem-title-row">
            <h1>#${q.id}. ${escapeHtml(q.title)}</h1>
            <span class="badge ${q.difficulty}" style="font-size: 0.85rem; padding: 4px 12px;">${q.difficulty}</span>
          </div>
          <div class="meta-pills">
            <span class="pill">🔢 <b>LeetCode:</b> #${q.lc}</span>
            ${q.premium ? '<span class="pill premium">🔒 LeetCode Premium</span>' : ''}
            <span class="pill">🧩 <b>Pattern:</b> ${q.pattern}</span>
            <span class="pill">⏱️ <b>Time:</b> ${q.time}</span>
            <span class="pill">💾 <b>Space:</b> ${q.space}</span>
          </div>
        </div>

        <div class="section-box">
          <h3>📌 Problem Statement (English)</h3>
          <div style="margin-bottom: 8px;">${q.statement}</div>
          <h4>Examples</h4>
          ${renderExamples(q)}
          <h4>Constraints</h4>
          <ul class="constraints">${q.constraints.map(c => `<li>${escapeHtml(c)}</li>`).join('')}</ul>
        </div>

        <div class="hinglish-box">
          <h3>🇮🇳 Same Question in Hinglish (Samajhne ke liye)</h3>
          <p>${q.statementHi}</p>
        </div>

        <div class="memory-box">
          <h3>🧠 Pointer Movement Flow & Exam Trigger</h3>
          <div class="flow-diagram">${escapeHtml(q.memoryFlow)}</div>
          <p style="color: #c7d2fe; font-weight: 600;">
            🔑 Exam Trigger: <span style="font-weight: 400; color: #f8fafc;">${q.memoryTip}</span>
          </p>
        </div>

        <div class="section-box">
          <h3>💡 Core Logic & Step-by-Step Intuition</h3>
          <p style="white-space: pre-line;">${q.intuition}</p>
        </div>

        <div class="pitfall-box">
          <h3>⚠️ Common Mistakes / Edge Cases</h3>
          <ul>${q.pitfalls.map(p => `<li>${p}</li>`).join('')}</ul>
        </div>

        <div class="code-container">
          <div class="code-header">
            <div style="display:flex; gap:8px;">
              <button class="lang-btn ${currentLang === 'java' ? 'active' : ''}" onclick="setLanguage('java')">☕ Java Solution</button>
              <button class="lang-btn ${currentLang === 'python' ? 'active' : ''}" onclick="setLanguage('python')">🐍 Python Solution</button>
            </div>
            <button class="copy-btn" onclick="copyCurrentQuestionCode(${q.id}, this)">📋 Copy Code</button>
          </div>
          <pre><code>${coloredCode}</code></pre>
        </div>

        <div class="nav-footer">
          ${q.id > 1 ? `<button class="btn-secondary" onclick="showQuestion(${q.id - 1})">← Prev: #${q.id - 1} ${escapeHtml(questions[q.id - 2].title)}</button>` : `<div></div>`}
          ${q.id < questions.length ? `<button class="btn-secondary" onclick="showQuestion(${q.id + 1})">Next: #${q.id + 1} ${escapeHtml(questions[q.id].title)} →</button>` : `<div></div>`}
        </div>
      `;
      if (!keepScroll) window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ==========================================================
    // COPY HELPERS
    // ==========================================================
    function copyCurrentQuestionCode(id, btn) {
      const q = questions.find(item => item.id === id);
      copyText(currentLang === 'java' ? q.java : q.python, btn);
    }

    function copyTemplate(index, btn) {
      copyText(templates[index][currentLang], btn);
    }

    function copyAllTemplates(btn) {
      const sep = currentLang === 'java' ? '\n\n' : '\n\n\n';
      copyText(templates.map(t => t[currentLang]).join(sep), btn);
    }

    function copyText(text, btn) {
      const done = () => {
        const old = btn.innerText;
        btn.innerText = '✅ Copied!';
        setTimeout(() => { btn.innerText = old; }, 1500);
      };
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); } catch (e) { btn.innerText = '❌ Copy failed'; }
        document.body.removeChild(ta);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done).catch(fallback);
      } else {
        fallback();
      }
    }

    // ==========================================================
    // INITIALIZATION
    // ==========================================================
    renderSidebar();
    showHome();
  </script>
</body>
</html>
