      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // ==========================================================
    // SYNTAX HIGHLIGHTER (single-pass tokenizer)
    // Comments (full-line AND trailing), strings, numbers, keywords,
    // class names aur function names sab sahi se color hote hain.
    // ==========================================================
    const JAVA_KEYWORDS = new Set([
      'class','public','private','protected','static','final','void','int','long','double','boolean','char',
      'new','return','if','else','while','for','null','true','false','this','break','continue','import','package','extends','implements'
    ]);
    const PY_KEYWORDS = new Set([
      'class','def','return','if','else','elif','while','for','in','not','and','or','is','None','True','False',
      'nonlocal','global','import','from','as','self','pass','break','continue','lambda'
    ]);
    const PY_TYPES = new Set(['int','bool','float','str','list','dict','set','tuple']);

    const JAVA_TOKEN_RE = /(\/\/[^\n]*)|("(?:[^"\\\n]|\\.)*")|('(?:[^'\\\n]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/g;
    const PY_TOKEN_RE   = /(#[^\n]*)|("(?:[^"\\\n]|\\.)*")|('(?:[^'\\\n]|\\.)*')|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/g;

    function highlightCode(code, lang) {
      const isJava = lang === 'java';
      const re = new RegExp((isJava ? JAVA_TOKEN_RE : PY_TOKEN_RE).source, 'g');
      const keywords = isJava ? JAVA_KEYWORDS : PY_KEYWORDS;
      const span = (cls, text) => `<span class="token ${cls}">${escapeHtml(text)}</span>`;

      let out = '';
      let last = 0;
      let m;
      while ((m = re.exec(code)) !== null) {
        out += escapeHtml(code.slice(last, m.index));
        const text = m[0];
        if (m[1]) out += span('comment', text);
        else if (m[2] || m[3]) out += span('string', text);
        else if (m[4]) out += span('number', text);
        else {
          const nextChar = code[re.lastIndex];
          if (keywords.has(text)) out += span('keyword', text);
          else if (!isJava && PY_TYPES.has(text)) out += span('class-name', text);
          else if (/^[A-Z]\w*[a-z]\w*$/.test(text)) out += span('class-name', text); // TreeNode, List, Solution...
          else if (nextChar === '(') out += span('function', text);
          else out += escapeHtml(text);
        }
        last = re.lastIndex;
      }
      out += escapeHtml(code.slice(last));
      return out;
    }

        java: `import java.util.*;

// ==========================================================
// TreeNode — har tree problem ka building block
// ==========================================================
class TreeNode {
    int val;          // node ki value (BST me ise 'key' bhi kehte hain)
    TreeNode left;    // left child  -> is subtree ki SAARI values chhoti (< val)
    TreeNode right;   // right child -> is subtree ki SAARI values badi (> val)

    TreeNode() {}
    TreeNode(int val) { this.val = val; }
    TreeNode(int val, TreeNode left, TreeNode right) {
        this.val = val;
        this.left = left;
        this.right = right;
    }
}

// Local testing helper: level-order array se tree banata hai (BFS se).
// Example: [5,3,6,2,4,null,7]
//   root = 5, left = 3, right = 6
//   3 ke bachche -> (2, 4)      6 ke bachche -> (null, 7)
public static TreeNode buildTree(Integer[] arr) {
    if (arr.length == 0 || arr[0] == null) return null;
    TreeNode root = new TreeNode(arr[0]);
    Queue<TreeNode> queue = new LinkedList<>();   // BFS queue: jinke bachche abhi jodne baaki hain
    queue.offer(root);
    int i = 1;                                    // arr me agla unused index
    while (!queue.isEmpty() && i < arr.length) {
        TreeNode node = queue.poll();
        // Left child
        if (i < arr.length && arr[i] != null) {
            node.left = new TreeNode(arr[i]);
            queue.offer(node.left);
        }
        i++;
        // Right child
        if (i < arr.length && arr[i] != null) {
            node.right = new TreeNode(arr[i]);
            queue.offer(node.right);
        }
        i++;
    }
    return root;
}`,

from collections import deque

# ==========================================================
# TreeNode — har tree problem ka building block
# ==========================================================
class TreeNode:
    def __init__(self, val=0, left=None, right=None):
        self.val = val        # node ki value (BST me ise 'key' bhi kehte hain)
        self.left = left      # left child  -> is subtree ki SAARI values chhoti (< val)
        self.right = right    # right child -> is subtree ki SAARI values badi (> val)

# Local testing helper: level-order list se tree banata hai (BFS se).
# Example: [5,3,6,2,4,None,7]
#   root = 5, left = 3, right = 6
#   3 ke bachche -> (2, 4)      6 ke bachche -> (None, 7)
def build_tree(arr: List[Optional[int]]) -> Optional[TreeNode]:
    if not arr or arr[0] is None:
        return None
    root = TreeNode(arr[0])
    queue = deque([root])      # BFS queue: jinke bachche abhi jodne baaki hain
    i = 1                      # arr me agla unused index
    while queue and i < len(arr):
        node = queue.popleft()
        # Left child
        if i < len(arr) and arr[i] is not None:
            node.left = TreeNode(arr[i])
            queue.append(node.left)
        i += 1
        # Right child
        if i < len(arr) and arr[i] is not None:
            node.right = TreeNode(arr[i])
            queue.append(node.right)
        i += 1
    return root`

// SEARCH — Recursive
// Time: O(H)   Space: O(H) (recursion call stack)
// ----------------------------------------------------------
public TreeNode searchBST(TreeNode root, int target) {
    // Base: tree khatam (null) ya node mil gaya -> dono me 'root' hi return
    if (root == null || root.val == target) return root;

    // Target chhota hai -> sirf LEFT me ho sakta hai
    if (target < root.val) return searchBST(root.left, target);

    // Target bada hai -> sirf RIGHT me ho sakta hai
    return searchBST(root.right, target);
}

// ----------------------------------------------------------
// SEARCH — Iterative (interview me ye zyada pasand kiya jata hai)
// Time: O(H)   Space: O(1)
// ----------------------------------------------------------
public TreeNode searchBSTIter(TreeNode root, int target) {
    TreeNode curr = root;
    while (curr != null) {
        if (target == curr.val) return curr;          // mil gaya
        curr = (target < curr.val) ? curr.left : curr.right;  // ek side chhod do
    }
    return null;                                      // poora path khatam, nahi mila
}`,

# SEARCH — Recursive
# Time: O(H)   Space: O(H) (recursion call stack)
# ----------------------------------------------------------
def search_bst(root: Optional[TreeNode], target: int) -> Optional[TreeNode]:
    # Base: tree khatam (None) ya node mil gaya -> dono me 'root' hi return
    if not root or root.val == target:
        return root

    # Target chhota hai -> sirf LEFT me ho sakta hai
    if target < root.val:
        return search_bst(root.left, target)

    # Target bada hai -> sirf RIGHT me ho sakta hai
    return search_bst(root.right, target)

# ----------------------------------------------------------
# SEARCH — Iterative (interview me ye zyada pasand kiya jata hai)
# Time: O(H)   Space: O(1)
# ----------------------------------------------------------
def search_bst_iter(root: Optional[TreeNode], target: int) -> Optional[TreeNode]:
    curr = root
    while curr:
        if target == curr.val:
            return curr                                   # mil gaya
        curr = curr.left if target < curr.val else curr.right  # ek side chhod do
    return None                                           # poora path khatam, nahi mila`

// INORDER (iterative) — Time O(N), Space O(H)
// Idea: jitna ho sake LEFT jao (stack me push), phir pop -> visit -> RIGHT jao

public List<Integer> inorderIter(TreeNode root) {
    List<Integer> res = new ArrayList<>();
    Deque<TreeNode> stack = new ArrayDeque<>();
    TreeNode curr = root;
    while (curr != null || !stack.isEmpty()) {
        while (curr != null) {          // left-most tak push karte jao
            stack.push(curr);
            curr = curr.left;
        }
        curr = stack.pop();             // sabse chhota pending node
        res.add(curr.val);              // visit
        curr = curr.right;              // ab uske right subtree ki baari
    }
    return res;
}

// ----------------------------------------------------------
public List<Integer> preorderIter(TreeNode root) {
    List<Integer> res = new ArrayList<>();
    if (root == null) return res;
    Deque<TreeNode> stack = new ArrayDeque<>();
    stack.push(root);
    while (!stack.isEmpty()) {
        TreeNode node = stack.pop();
        res.add(node.val);                                  // visit root
        if (node.right != null) stack.push(node.right);    // right pehle push
        if (node.left != null) stack.push(node.left);      // left baad me push -> pehle pop
    }
    return res;

    if (root == null) return res;
    Deque<TreeNode> stack = new ArrayDeque<>();
    stack.push(root);
    while (!stack.isEmpty()) {
        TreeNode node = stack.pop();
        res.addFirst(node.val);                             // front me daalna = reverse
        if (node.left != null) stack.push(node.left);      // left pehle push
        if (node.right != null) stack.push(node.right);    // right baad me -> pehle pop
    }
    return res;     // Root-Right-Left ka reverse = Left-Right-Root
}

    TreeNode curr = root;
    while (curr != null || !stack.isEmpty()) {

        curr = stack.pop();

public List<List<Integer>> levelOrder(TreeNode root) {
    List<List<Integer>> res = new ArrayList<>();
    if (root == null) return res;
    Queue<TreeNode> queue = new LinkedList<>();
    queue.offer(root);
    while (!queue.isEmpty()) {
        int size = queue.size();                // isi level ke nodes ki ginti
        List<Integer> level = new ArrayList<>();
        for (int i = 0; i < size; i++) {
            TreeNode node = queue.poll();
            level.add(node.val);
            if (node.left != null) queue.offer(node.left);    // agle level ke liye
            if (node.right != null) queue.offer(node.right);
        }
        res.add(level);
    }
    return res;

<b>Complexity:</b> Worst O(N), early exit se aksar kam. Space: window O(K) + stack O(H). (Follow-up me balanced BST par O(K + log N) ke liye predecessor/successor stacks use hote hain.)`,

    public List<Integer> closestKValues(TreeNode root, double target, int k) {
        // Deque = sliding window of size <= k. Front = sabse chhota (inorder me sabse pehle aaya)
        Deque<Integer> window = new ArrayDeque<>();
        inorder(root, target, k, window);
        return new ArrayList<>(window);

    private void inorder(TreeNode node, double target, int k, Deque<Integer> window) {
        if (node == null) return;

        // 1) Pehle left subtree (chhoti values)

                return;
            }
        }

        // 3) Right subtree (badi values)
        inorder(node.right, target, k, window);
    }

class Solution:
    def closestKValues(self, root: Optional[TreeNode], target: float, k: int) -> List[int]:
        # deque = sliding window of size <= k. Front = sabse chhota (inorder me sabse pehle aaya)
        window = deque()

        def inorder(node):
            if not node:
                return

            # 1) Pehle left subtree (chhoti values)
            inorder(node.left)

            if len(window) < k:
                # Window abhi bhari nahi: val seedha add
                window.append(node.val)
            else:
                # Window full hai. Naya val front (sabse chhota) se zyada paas hai?
                if abs(node.val - target) < abs(window[0] - target):
                    window.popleft()           # sabse door wala (front) hatao
                    window.append(node.val)    # naya paas wala add (window aage khiska)
                else:
                    # Naya val front se bhi door hai. Sorted order hai, isliye iske baad ki
                    # saari values aur door hongi -> yahin ruk jao (early exit)
                    return

            # 3) Right subtree (badi values)
            inorder(node.right)

        inorder(root)
        return list(window)`
      }

    function copyText(text, btn) {
      const done = () => {
        const old = btn.innerText;
        btn.innerText = '✅ Copied!';
        setTimeout(() => { btn.innerText = old; }, 1500);
      };
      // Fallback: kuch browsers file:// par clipboard API block karte hain
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); done(); } catch (e) { btn.innerText = '❌ Copy failed'; }
        document.body.removeChild(ta);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(fallback);
      } else {
        fallback();
      }
    }

    renderSidebar();
    showHome(true);
  </script>
</body>
